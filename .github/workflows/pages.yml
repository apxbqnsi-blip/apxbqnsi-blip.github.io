name: Publish Aniimax r13 RV 22
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and unpack the reviewed public site
        shell: bash
        run: |
          echo "666ff1587a706f4f2369d17776fe4792d69a6981c2ae8876acbd029e9b3ba710  site.zip" | sha256sum --check
          python -m zipfile -e site.zip _site
          test -f _site/index.html
          test -f _site/pkg/aniimax_bg.wasm
          test ! -e _site/editor.html
          test ! -e _site/editor.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
